# One in-memory DB per Spring context, tagged with the JVM fork number.
#  - fork.number  -> no sharing between Surefire/Failsafe forks (for a real DB: schema/database per fork)
#  - random.uuid  -> no sharing between different cached contexts in the same JVM
spring.datasource.url=jdbc:h2:mem:fork${fork.number:0}-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# >= JUnit parallelism (checked by the guard, rule PT11): transactional tests hold a connection per test
spring.datasource.hikari.maximum-pool-size=20
# Any real call to the external FX service must fail fast: tests use @PerTestMock.
fx.base-url=http://fx.invalid
