# Two shared contexts: AbstractIntegrationTest (full app) and AbstractJpaTest (JPA slice).
max-contexts=2
# Project-specific global state that tests must not touch (in addition to the defaults:
# CrudRepository#deleteAll()/count()/findAll(), JpaRepository#deleteAllInBatch(), JdbcTestUtils...).
forbidden-calls=com.example.parallel.audit.AuditLog#clear()
